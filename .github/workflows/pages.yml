name: Pages

# The Chrome Web Store requires a public URL for the privacy policy, so the
# document that lives next to the code is what gets published.
on:
  push:
    branches: [main]
    paths:
      ['PRIVACY.md', 'assets/logo.svg', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # deploy-pages publishes the artifact verbatim, so the HTML is built here
      # rather than relying on Jekyll to render markdown after upload.
      - run: npm run build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deploy
        uses: actions/deploy-pages@v4
