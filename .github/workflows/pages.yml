name: Pages

# The Chrome Web Store requires a public URL for the privacy policy, so the
# document that lives next to the code is what gets published.
on:
  push:
    branches: [main]
    paths: ['PRIVACY.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: |
          mkdir -p site
          cp PRIVACY.md site/index.md
          cat > site/_config.yml <<'YAML'
          title: Mailmoss
          description: Privacy policy
          theme: jekyll-theme-minimal
          YAML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
