<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mailmoss">
  <title>Mailmoss</title>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#153024" />
      <stop offset="1" stop-color="#08150f" />
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e3ece6" />
    </linearGradient>

    <linearGradient id="moss" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#15803d" />
      <stop offset="0.5" stop-color="#22c55e" />
      <stop offset="1" stop-color="#86efac" />
    </linearGradient>

    <!-- Keeps the growth inside the envelope's rounded corners. -->
    <clipPath id="insideEnvelope">
      <rect x="20" y="28" width="88" height="66" rx="12" />
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#tile)" />

  <g>
    <rect x="20" y="28" width="88" height="66" rx="12" fill="url(#paper)" />

    <!-- The flap, drawn as a crease rather than a filled shape so it survives 16px. -->
    <path
      d="M27 39 L64 68 L101 39"
      fill="none"
      stroke="#12291e"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Moss creeping up from the bottom edge. Kept to roughly a quarter of the
         envelope so the paper still reads as paper at toolbar size. -->
    <g clip-path="url(#insideEnvelope)" fill="url(#moss)">
      <circle cx="31" cy="95" r="15" />
      <circle cx="54" cy="97" r="13" />
      <circle cx="77" cy="94" r="16" />
      <circle cx="99" cy="97" r="12" />
      <rect x="20" y="94" width="88" height="12" />
    </g>
  </g>

  <!-- Spores drifting off the growth: the quiet spread the name is about.
       Placed on the tile, never on the paper, where they would read as dirt. -->
  <g fill="#86efac">
    <circle cx="112" cy="24" r="3.6" opacity="0.9" />
    <circle cx="120" cy="14" r="2.2" opacity="0.6" />
  </g>
</svg>
